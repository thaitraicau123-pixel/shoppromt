<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6ED" />
      <stop offset="100%" stop-color="#F3EDE0" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A47838" />
      <stop offset="50%" stop-color="#8A5F26" />
      <stop offset="100%" stop-color="#5E3E13" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#8A5F26" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#D5C7B2" stroke-width="2" />
  
  <!-- Subtle Inner Ring -->
  <rect x="4" y="4" width="56" height="56" rx="13" fill="none" stroke="#E6DCCB" stroke-width="1" />
  
  <!-- BT Monogram in Caramel Amber Gold -->
  <g filter="url(#shadow)">
    <!-- Letter B -->
    <path d="M 17 18 L 29 18 C 33 18 36 20.5 36 24.5 C 36 27.5 34 29.5 31.5 30.5 C 34.5 31.5 37 34 37 38 C 37 42.5 33.5 46 28.5 46 L 17 46 Z M 22 23 L 22 29 L 28 29 C 30 29 31.5 28 31.5 26 C 31.5 24 30 23 28 23 Z M 22 34 L 22 41 L 28.5 41 C 31 41 32.5 39.5 32.5 37.5 C 32.5 35.5 31 34 28.5 34 Z" fill="url(#goldGrad)" />
    
    <!-- Letter T -->
    <path d="M 36 23 L 36 18 L 50 18 L 50 23 L 45.5 23 L 45.5 46 L 40.5 46 L 40.5 23 Z" fill="url(#goldGrad)" />
  </g>
  
  <!-- Sparkle Accent Top Right -->
  <circle cx="50" cy="14" r="2.5" fill="#C28B38" />
</svg>
